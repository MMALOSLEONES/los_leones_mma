version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mon_postgres_16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passer
      POSTGRES_DB: mma_leones_dba
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
